# -- Name of the CNPG Cluster (service becomes <name>-rw).
clusterName: pg
# -- PostgreSQL image (pinned; also preloaded by scripts/preload-images.sh).
imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
instances: 1
storage:
  size: 5Gi
  storageClass: ""
# -- Secret (basic-auth) holding the postgres superuser password.
superuserSecret: pg-superuser
# -- One login role + database per entry. The role password is read from the
# basic-auth Secret pg-role-<name>, created outside Git (scripts/bootstrap.sh).
databases: []
#  - name: airflow
resources: {}
