apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "silo.labels" . | nindent 4 }}
spec:
  selector: {{- include "silo.selector" . | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  labels: {{- include "silo.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "silo.selector" . | nindent 4 }}
  ports:
    - name: s3
      port: 9000
