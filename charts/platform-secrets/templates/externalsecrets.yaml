{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ required "secrets[].namespace is required" .namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- if or .type .labels .template }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      {{- with .type }}
      type: {{ . }}
      {{- end }}
      {{- with .labels }}
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .template }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  data:
    {{- range $secretKey, $ref := .data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key }}
        property: {{ $ref.property }}
    {{- end }}
{{- end }}
