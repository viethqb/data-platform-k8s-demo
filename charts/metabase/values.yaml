image:
  repository: docker.io/metabase/metabase
  tag: v0.63.22.4
  pullPolicy: IfNotPresent

# -- Public URL incl. sub-path and trailing slash (MB_SITE_URL).
siteUrl: ""

database:
  host: ""
  port: 5432
  name: metabase
  user: metabase
  # -- Secret/key holding the DB password (created outside Git).
  passwordSecret: metabase-db
  passwordSecretKey: password

javaOpts: "-Xmx1g"

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 2Gi

ingress:
  enabled: false
  className: nginx
  host: ""
  # -- Path prefix, stripped by ingress-nginx (Metabase listens on "/").
  path: /metabase
