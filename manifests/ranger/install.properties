# Apache Ranger Admin install.properties (non-secret part).
# Passwords are appended at container start from the ranger-secrets Secret.
PYTHON_COMMAND_INVOKER=python3
RANGER_ADMIN_LOG_DIR=/var/log/ranger
RANGER_PID_DIR_PATH=/var/run/ranger
RANGER_ADMIN_LOGBACK_CONF_FILE=/opt/ranger/admin/ews/webapp/WEB-INF/classes/conf/logback.xml

DB_FLAVOR=POSTGRES
SQL_CONNECTOR_JAR=/usr/share/java/postgresql.jar
db_host=pg-rw.postgres.svc.cluster.local:5432
db_name=ranger
db_user=ranger
db_root_user=ranger
# Database + role are created by CloudNativePG, so skip Ranger's DBA step.
setup_mode=SeparateDBA
postgres_core_file=db/postgres/optimized/current/ranger_core_db_postgres.sql
postgres_audit_file=db/postgres/xa_audit_db_postgres.sql
mysql_core_file=db/mysql/optimized/current/ranger_core_db_mysql.sql
mysql_audit_file=db/mysql/xa_audit_db.sql
oracle_core_file=
sqlserver_core_file=
sqlanywhere_core_file=

# No audit store in the lab (Solr/OpenSearch can be added later).
audit_store=

policymgr_external_url=http://data.127.0.0.1.nip.io:8080/ranger
policymgr_http_enabled=true

unix_user=ranger
unix_user_pwd=ranger
unix_group=ranger
cred_keystore_filename=
XAPOLICYMGR_DIR=$PWD
app_home=$PWD/ews/webapp
TMPFILE=$PWD/.fi_tmp
LOGFILE=$PWD/logfile
LOGFILES="$LOGFILE"
JAVA_BIN='java'
JAVA_VERSION_REQUIRED='1.8'
ranger_admin_max_heap_size=1g
PATCH_RETRY_INTERVAL=120
STALE_PATCH_ENTRY_HOLD_TIME=10
hadoop_conf=
authentication_method=NONE
spnego_principal=
spnego_keytab=
token_valid=
admin_principal=
admin_keytab=
lookup_principal=
lookup_keytab=
