# Listen on the same ports kind publishes on the host (environments/uat/kind-cluster.yaml).
controller:
  containerPort:
    http: 8080
    https: 8443
  hostPort:
    ports:
      http: 8080
      https: 8443
  extraArgs:
    http-port: "8080"
    https-port: "8443"
  admissionWebhooks:
    # Default 8443 would clash with the HTTPS listener above.
    port: 9443
