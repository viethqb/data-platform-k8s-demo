# kind cluster for UAT.
# ingress-nginx listens on 8080/8443 inside the node and the same ports are
# published on the host, so X-Forwarded-Port matches the browser URL and apps
# build redirects with the right port.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform-uat
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 8080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 8443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
