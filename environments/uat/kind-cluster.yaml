# kind cluster for UAT.
# ingress-nginx listens on 80/443 inside the node and the same ports are
# published on the host, so X-Forwarded-Port/Proto match the browser URL
# (https://data-uat.127.0.0.1.nip.io) and apps build correct redirects.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform-uat
# Let containerd read per-registry mirror config from /etc/containerd/certs.d
# (written by scripts/registry-cache.sh to use the local pull-through caches).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
