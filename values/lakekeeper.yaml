# Lakekeeper (Iceberg REST catalog)
#   UI (browser):        http://data.127.0.0.1.nip.io:8080/lakekeeper/ui/
#   Catalog (in-cluster): http://lakekeeper.lakekeeper.svc:8181/catalog
catalog:
  config:
    # Where the browser reaches Lakekeeper. Iceberg clients inside the cluster
    # keep using the service URL, so LAKEKEEPER__BASE_URI is intentionally unset.
    LAKEKEEPER__UI__LAKEKEEPER_URL: http://data.127.0.0.1.nip.io:8080/lakekeeper
  ingress:
    enabled: true
    ingressClassName: nginx
    host: data.127.0.0.1.nip.io
    path: /lakekeeper(/|$)(.*)
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/x-forwarded-prefix: /lakekeeper

secretBackend:
  postgres:
    encryptionKeySecret: lakekeeper-encryption
    encryptionKeySecretKey: encryptionKey

# Use the shared CloudNativePG cluster instead of the bundled Postgres.
postgresql:
  enabled: false

externalDatabase:
  type: postgres
  host_read: pg-rw.postgres.svc.cluster.local
  host_write: pg-rw.postgres.svc.cluster.local
  port: 5432
  database: lakekeeper
  user: lakekeeper
  passwordSecret: lakekeeper-db
  passwordSecretKey: password
