catalog:
  ingress:
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2

secretBackend:
  postgres:
    encryptionKeySecret: lakekeeper-encryption
    encryptionKeySecretKey: encryptionKey

# Use the shared CloudNativePG cluster instead of the bundled Postgres.
postgresql:
  enabled: false

externalDatabase:
  type: postgres
  host_read: pg-rw.postgres.svc.cluster.local
  host_write: pg-rw.postgres.svc.cluster.local
  port: 5432
  database: lakekeeper
  user: lakekeeper
  passwordSecret: lakekeeper-db
  passwordSecretKey: password
