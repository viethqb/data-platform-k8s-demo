# Every Kubernetes Secret the platform needs, synced from Vault (KV v2 "secret/").
# Vault holds each value once; scripts/vault-setup.sh seeds random values.
#
#   secret/platform/postgres/superuser   password
#   secret/platform/postgres/<app>       password       (lakekeeper, airflow, metabase, ranger)
#   secret/platform/lakekeeper           encryption-key
#   secret/platform/airflow              fernet-key, api-secret-key, jwt-secret, admin-password
#   secret/platform/ranger               admin-password
#   secret/platform/silo                 root-user, root-password
#   secret/platform/polaris              root-client-secret, token-key
secrets:
  # --- PostgreSQL (CloudNativePG reads basic-auth secrets in its namespace)
  - name: pg-superuser
    namespace: postgres
    type: kubernetes.io/basic-auth
    data:
      password: { key: platform/postgres/superuser, property: password }
    template:
      username: postgres
  - name: pg-role-lakekeeper
    namespace: postgres
    type: kubernetes.io/basic-auth
    data:
      password: { key: platform/postgres/lakekeeper, property: password }
    template:
      username: lakekeeper
  - name: pg-role-airflow
    namespace: postgres
    type: kubernetes.io/basic-auth
    data:
      password: { key: platform/postgres/airflow, property: password }
    template:
      username: airflow
  - name: pg-role-metabase
    namespace: postgres
    type: kubernetes.io/basic-auth
    data:
      password: { key: platform/postgres/metabase, property: password }
    template:
      username: metabase
  - name: pg-role-ranger
    namespace: postgres
    type: kubernetes.io/basic-auth
    data:
      password: { key: platform/postgres/ranger, property: password }
    template:
      username: ranger
  - name: pg-role-polaris
    namespace: postgres
    type: kubernetes.io/basic-auth
    data:
      password: { key: platform/postgres/polaris, property: password }
    template:
      username: polaris

  # --- Lakekeeper
  - name: lakekeeper-db
    namespace: lakekeeper
    data:
      password: { key: platform/postgres/lakekeeper, property: password }
  - name: lakekeeper-encryption
    namespace: lakekeeper
    data:
      encryptionKey: { key: platform/lakekeeper, property: encryption-key }

  # --- Airflow
  - name: airflow-metadata
    namespace: airflow
    data:
      password: { key: platform/postgres/airflow, property: password }
    template:
      connection: "postgresql://airflow:{{ .password }}@pg-rw.postgres.svc.cluster.local:5432/airflow?sslmode=disable"
  - name: airflow-fernet-key
    namespace: airflow
    data:
      fernet-key: { key: platform/airflow, property: fernet-key }
  - name: airflow-api-secret-key
    namespace: airflow
    data:
      api-secret-key: { key: platform/airflow, property: api-secret-key }
  - name: airflow-jwt-secret
    namespace: airflow
    data:
      jwt-secret: { key: platform/airflow, property: jwt-secret }
  - name: airflow-admin
    namespace: airflow
    data:
      password: { key: platform/airflow, property: admin-password }

  # --- Metabase
  - name: metabase-db
    namespace: metabase
    data:
      password: { key: platform/postgres/metabase, property: password }

  # --- Ranger
  - name: ranger-secrets
    namespace: ranger
    data:
      db-password: { key: platform/postgres/ranger, property: password }
      admin-password: { key: platform/ranger, property: admin-password }

  # --- Silo
  - name: silo-root
    namespace: silo
    data:
      MINIO_ROOT_USER: { key: platform/silo, property: root-user }
      MINIO_ROOT_PASSWORD: { key: platform/silo, property: root-password }

  # --- Polaris
  - name: polaris-persistence
    namespace: polaris
    data:
      password: { key: platform/postgres/polaris, property: password }
    template:
      username: polaris
      jdbcUrl: jdbc:postgresql://pg-rw.postgres.svc.cluster.local:5432/polaris
  - name: polaris-token-broker
    namespace: polaris
    data:
      symmetric.key: { key: platform/polaris, property: token-key }
  - name: polaris-storage
    namespace: polaris
    data:
      awsAccessKeyId: { key: platform/silo, property: root-user }
      awsSecretAccessKey: { key: platform/silo, property: root-password }
  # Root principal of realm POLARIS (console login + bootstrap job)
  - name: polaris-root
    namespace: polaris
    data:
      client-secret: { key: platform/polaris, property: root-client-secret }
    template:
      client-id: root
      credential: "POLARIS,root,{{ index . \"client-secret\" }}"
