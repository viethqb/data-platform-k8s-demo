# StarRocks authorisation in Apache Ranger (access_control = ranger on the FE).
superUsers:
  - root

# Resource lookup in the Ranger UI (autocomplete, Test Connection) through the
# StarRocks plugin baked into images/ranger-admin.
# The lookup user gets read-only items inside the superuser policies for
# catalog=* (usage) and catalog/database/table/column=* (select): Ranger allows
# one policy per resource set, and StarRocks only lists objects the user holds
# a privilege on.
lookup:
  enabled: true
  user: ranger_lookup

# Tag-based policies (service starrocks_tag), exercised by scripts/test-ranger-starrocks.py
tagService:
  enabled: true
  name: starrocks_tag

# Demo: "analyst" may read lakehouse.sales.orders, only the Hanoi rows,
# with the amount column masked. The table is created by charts/starrocks-setup.
users:
  - analyst
  - ranger_lookup
  - dwh_airflow

policies:
  - name: analyst-read-orders
    type: access
    resources: { catalog: lakehouse, database: sales, table: orders, column: "*" }
    users: [analyst]
    accesses: [select]
  - name: analyst-orders-hanoi-only
    type: rowFilter
    resources: { catalog: lakehouse, database: sales, table: orders }
    users: [analyst]
    filter: "city = 'Hanoi'"
  - name: analyst-mask-amount
    type: mask
    resources: { catalog: lakehouse, database: sales, table: orders, column: amount }
    users: [analyst]
    maskType: MASK_NULL

  # dwh_airflow: Airflow/dbt of demo-dwh builds the warehouse in the Iceberg
  # catalog lakehouse (create/alter/drop databases, tables and views, load data).
  - name: dwh-airflow-catalog
    type: access
    resources: { catalog: lakehouse }
    users: [dwh_airflow]
    accesses: [usage, create database, alter, drop]
  - name: dwh-airflow-databases
    type: access
    resources: { catalog: lakehouse, database: "*" }
    users: [dwh_airflow]
    accesses: [create table, create view, create materialized view, create function, alter, drop]
  - name: dwh-airflow-tables
    type: access
    resources: { catalog: lakehouse, database: "*", table: "*" }
    users: [dwh_airflow]
    accesses: [insert, delete, update, alter, drop, refresh, export]
  - name: dwh-airflow-columns
    type: access
    resources: { catalog: lakehouse, database: "*", table: "*", column: "*" }
    users: [dwh_airflow]
    accesses: [select]
  - name: dwh-airflow-views
    type: access
    resources: { catalog: lakehouse, database: "*", view: "*" }
    users: [dwh_airflow]
    accesses: [alter, drop]
  - name: dwh-airflow-materialized-views
    type: access
    resources: { catalog: lakehouse, database: "*", materialized_view: "*" }
    users: [dwh_airflow]
    accesses: [alter, drop, refresh]
