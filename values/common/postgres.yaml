clusterName: pg
superuserSecret: pg-superuser
# One login role + database per app; passwords live in pg-role-<name> secrets.
databases:
  - name: lakekeeper
  - name: airflow
  - name: metabase
  - name: ranger
  - name: polaris
    # Polaris creates its tables but not the schema itself.
    schemas:
      - polaris_schema
