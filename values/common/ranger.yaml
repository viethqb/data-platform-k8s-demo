contextPath: /ranger
database:
  host: pg-rw.postgres.svc.cluster.local:5432
  name: ranger
  user: ranger
secretName: ranger-secrets

siteProperties:
  # Plugins (StarRocks FE) download policies without Kerberos, i.e. through the
  # unauthenticated endpoint, which Ranger refuses by default. It returns
  # policies, not secrets; acceptable for the lab, use Kerberos in production.
  ranger.admin.allow.unauthenticated.access: "true"
