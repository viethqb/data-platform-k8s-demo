executor: LocalExecutor

# The apache/airflow image sets AIRFLOW__CORE__LOAD_EXAMPLES=false, and env vars
# win over airflow.cfg, so example DAGs must be enabled through env too.
env:
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "True"

ingress:
  apiServer:
    ingressClassName: nginx
    pathType: Prefix

# Metadata DB lives in the shared CloudNativePG cluster.
postgresql:
  enabled: false
redis:
  enabled: false
pgbouncer:
  enabled: false
data:
  metadataSecretName: airflow-metadata

# Keys are generated by scripts/bootstrap.sh so they stay out of Git.
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret

# Argo CD does not run Helm hooks the way Helm does; run these as normal Jobs.
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-admin
          key: password
  args:
    - bash
    - -c
    - |-
      exec airflow users create -r Admin -u admin -e admin@example.com \
        -f admin -l user -p "${AIRFLOW_ADMIN_PASSWORD}"
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync

apiServer:
  # Airflow 3 api-server needs ~60-90s before it listens.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10

# scheduler/triggerer/dag-processor probes run `airflow jobs check`, which
# starts a Python process (~15s CPU). Under load the default 20s timeout
# trips, the pod restarts and adds even more load. Give them room.
scheduler:
  startupProbe:
    periodSeconds: 30
    timeoutSeconds: 60
    failureThreshold: 20
  livenessProbe:
    timeoutSeconds: 60
dagProcessor:
  livenessProbe:
    timeoutSeconds: 60

triggerer:
  livenessProbe:
    timeoutSeconds: 60
  persistence:
    size: 1Gi
logs:
  persistence:
    enabled: false
statsd:
  enabled: false
