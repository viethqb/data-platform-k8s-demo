configs:
  params:
    # TLS terminates at (or is skipped by) ingress-nginx.
    server.insecure: true
    # The repo vendors its charts (~6 MB); on a slow link `git fetch` took
    # longer than the 60s default and manifest generation failed.
    controller.repo.server.timeout.seconds: "300"
    server.repo.server.timeout.seconds: "300"
  cm:
    # Track resources by annotation so charts that set their own
    # app.kubernetes.io/instance label don't confuse Argo CD.
    application.resourceTrackingMethod: annotation
    # Report a child Application's health to its parent (Argo CD does not by
    # default). The root app-of-apps then waits for each sync wave to be
    # Healthy before starting the next one, instead of starting every app at
    # once and starving the node of CPU.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

# Same official image as the chart default (ecr-public.aws.com/docker/library/redis),
# but from Docker Hub so it goes through the docker.io pull-through cache
# (the ECR Public endpoint rejects anonymous proxy pulls).
redis:
  image:
    repository: docker.io/library/redis

repoServer:
  env:
    # Timeout for git/helm commands run by the repo server (default 90s).
    - name: ARGOCD_EXEC_TIMEOUT
      value: 5m
