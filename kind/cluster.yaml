# kind cluster for the data platform lab.
# Host ports 80/443 are often taken, so ingress-nginx listens on 8080/8443.
# The node port and the host port are the same on purpose: nginx then sends
# X-Forwarded-Port: 8080, so apps build redirects with the port the browser uses.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 8080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 8443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
