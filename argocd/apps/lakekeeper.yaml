apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakekeeper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://lakekeeper.github.io/lakekeeper-charts/
      chart: lakekeeper
      targetRevision: 0.15.0
      helm:
        releaseName: lakekeeper
        valueFiles:
          - $values/values/lakekeeper.yaml
    - repoURL: https://github.com/viethqb/data-platform-k8s-demo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lakekeeper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
